name: CI & Deploy

on:
  push:
    branches: [main, 'ccr-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database security + E2E (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,storage-api
      - run: npx supabase db reset
      - run: npm run test:db
      - name: Build against the local stack
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d'"' -f2)" >> .env.local
          printf 'SUPABASE_URL=http://127.0.0.1:54321\nSUPABASE_ANON_KEY=%s\n' "$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d'"' -f2)" > .dev.vars
          npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx supabase db reset && npm run test:e2e

  deploy:
    name: Deploy to Cloudflare Pages (profjero-edupro)
    needs: [checks, database]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Skip when Cloudflare credentials are not configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set — skipping deploy. See docs/DEPLOYMENT.md."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        run: npm ci && npm run build
      - if: steps.gate.outputs.go == 'true'
        name: Deploy (production branch = main; other branches = preview)
        run: npx wrangler pages deploy dist --project-name=profjero-edupro --branch="${GITHUB_REF_NAME}" --commit-dirty=true
